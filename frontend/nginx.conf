server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_vary on;

    # Cache lungo per assets con hash nel nome (Angular build)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|webp|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Angular/Ionic routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
