<ion-tabs (ionTabsDidChange)="onTabsDidChange()">
  <ion-tab-bar slot="bottom" [class.tab-bar-hidden]="isSubPage()">
    @if (dataService.socialEnabled()) {
    <ion-tab-button tab="discover">
      <ion-icon name="library"></ion-icon>
      <ion-label>{{ 'HOME_PAGE.TAB_DISCOVER' | translate }}</ion-label>
    </ion-tab-button>
    }

    <ion-tab-button tab="recipe-list">
      <ion-icon name="pizza"></ion-icon>
      <ion-label>{{ 'HOME_PAGE.TAB_RECIPES' | translate }}</ion-label>
    </ion-tab-button>

    @if (dataService.planningEnabled()) {
    <ion-tab-button tab="planning">
      <ion-icon name="calendar"></ion-icon>
      <ion-label>{{ 'HOME_PAGE.TAB_PLANNING' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="shopping-list">
      <ion-icon name="basket"></ion-icon>
      <ion-label>{{ 'HOME_PAGE.TAB_SHOPPING' | translate }}</ion-label>
    </ion-tab-button>
    }

    <ion-tab-button tab="settings">
      <ion-icon name="cog"></ion-icon>
      <ion-label>{{ 'HOME_PAGE.TAB_SETTINGS' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
